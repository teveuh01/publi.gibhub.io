<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vicente Toledo Metalúrgica en General</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .carousel-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            height: 500px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .carousel {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }
        .slide {
            min-width: 100%;
            height: 100%;
            flex-shrink: 0;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta la imagen sin distorsión */
        }
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            font-size: 24px;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .arrow-left {
            left: 10px;
        }
        .arrow-right {
            right: 10px;
        }
        .arrow:hover {
            background: rgba(0,0,0,0.8);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 2em;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div>
        <h1>Vicente Toledo Metalúrgica en General</h1>
        <div class="carousel-container">
            <button class="arrow arrow-left" onclick="moveSlide(-1)">←</button>
            <div class="carousel" id="carousel">
                <!-- Slides principales -->
                <div class="slide"><img src="images/imagen1.jpg" alt="Proyecto 1"></div>
                <div class="slide"><img src="images/imagen2.jpg" alt="Proyecto 2"></div>
                <div class="slide"><img src="images/imagen3.jpg" alt="Proyecto 3"></div>
                <div class="slide"><img src="images/imagen4.jpg" alt="Proyecto 4"></div>
                <div class="slide"><img src="images/imagen5.jpg" alt="Proyecto 5"></div>
                <!-- Clones para loop infinito -->
                <div class="slide"><img src="images/imagen1.jpg" alt="Proyecto 1"></div>
                <div class="slide"><img src="images/imagen5.jpg" alt="Proyecto 5"></div>
            </div>
            <button class="arrow arrow-right" onclick="moveSlide(1)">→</button>
        </div>
        <footer>
            <p>Explora nuestros proyectos de metalurgia. Usa las flechas para navegar.</p>
        </footer>
    </div>

    <script>
        let currentIndex = 1; // Empieza en el primero real
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length - 2; // Resta clones
        const carousel = document.getElementById('carousel');

        function moveSlide(direction) {
            currentIndex += direction;
            
            // Loop infinito
            if (currentIndex > totalSlides) {
                currentIndex = 1;
                carousel.style.transition = 'none';
            } else if (currentIndex < 1) {
                currentIndex = totalSlides;
                carousel.style.transition = 'none';
            } else {
                carousel.style.transition = 'transform 0.5s ease-in-out';
            }
            
            setTimeout(() => {
                carousel.style.transition = 'transform 0.5s ease-in-out';
            }, 50);
            
            carousel.style.transform = `translateX(-${currentIndex * 100}%)`;
        }
    </script>
</body>
</html>
